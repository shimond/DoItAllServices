<mat-toolbar color="primary" class="main-toolbar">
    <span>CarePulse Patient Monitoring Systems</span>
    <span style="flex: 1 1 auto;"></span>
    <a mat-button routerLink="/" routerLinkActive="active-link">Dashboard</a>
    <a mat-button routerLink="/add-patient" routerLinkActive="active-link">Add Patient</a>
    <button mat-icon-button (click)="toggleChat()" [attr.aria-label]="showChat ? 'Hide AI Chat' : 'Show AI Chat'">
      <mat-icon>{{ showChat ? 'close' : 'chat' }}</mat-icon>
    </button>
</mat-toolbar>
<div class="main-content-with-sidebar">
  <div class="main-content" style="padding-top: 64px;">
    <router-outlet></router-outlet>
  </div>
  <div class="chat-sidebar" [class.open]="showChat">
    <app-chat-ai *ngIf="showChat"></app-chat-ai>
  </div>
</div>
